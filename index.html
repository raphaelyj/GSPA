const dialog={open:false,lines:[],idx:0,choices:null,speaker:"",text:""};
let choiceIdx=0;

function openDialog(lines){
  dialog.open=true;dialog.lines=lines;dialog.idx=0;
  dialog.choices=null;choiceIdx=0;
  dialog.speaker=lines[0]?.speaker??"";
  dialog.text=lines[0]?.text??"";
  if(lines[0]?.choices)dialog.choices=lines[0].choices;
}
function dlgNext(){
  const cur=dialog.lines[dialog.idx];
  if(cur?.onEnd)cur.onEnd();
  if(dialog.choices)return;
  dialog.idx++;
  if(dialog.idx>=dialog.lines.length){dialog.open=false;dialog.choices=null;return;}
  const n=dialog.lines[dialog.idx];
  dialog.speaker=n.speaker??"";dialog.text=n.text??"";
  dialog.choices=n.choices??null;choiceIdx=0;
}
function pickChoice(fn){dialog.open=false;dialog.choices=null;fn();}

//* ══════ 스페이스 / 위 키 핸들러 ══════ */
function onSpace(){
  if(scene==="title"){scene="charSelect";return;}
  if(scene==="charSelect"){
    if(charIdx===1){
      alert("양적연구로 변절한 연구자입니다.");
      return;
    }
    if(charIdx===2){
      alert("현생이 바빠 아직 진행할 수 없습니다.....");
      return;
    }
    selectedChar=CHARS[charIdx];scene="game";initGame();return;
  }
  if(scene==="reject"){resetGame();return;}
  if(scene==="drop"){
    // 드랍 맵에서는 space 없음
    return;
  }
  if(scene==="game"||scene==="ending_dlg"){
    if(dialog.open){
      if(dialog.choices)pickChoice(dialog.choices[choiceIdx].fn);
      else dlgNext();
    }else{
      tryInteract();
    }
  }
  if(scene==="chase"){
    if (chaseJustStarted) {
      // 대사에서 넘어온 Space 입력 한 번은 무시
      chaseJustStarted = false;
      return;
    }
    if (chasePaused) {
      // 안내창 떠 있을 때, 그 다음 Space부터 닫기
      chasePaused = false;
      return;
    }
    return;
  }
}
function onUp(){
  if(scene==="charSelect"){charIdx=(charIdx+1)%CHARS.length;return;}
  if(scene==="game"){
    if(!dialog.open&&tryPortal())return;
    if(PL.onGround){PL.vy=JUMP;}
  }
  if(scene==="chase"){
    if(!chasePaused&&PROF_CHASE_ACTIVE&&PL.onGround)PL.vy=JUMP;
  }
  if(scene==="drop"){
    if(dropOnGround)dropVY=DROP_JUMP;
  }
  if(dialog.open&&dialog.choices)
    choiceIdx=Math.max(0,choiceIdx-1);
}

function gotoMap(target,spawnX,spawnY){
  if(target==="__ending__"){
    scene="ending_dlg";
    openDialog(T.ending);
    return;
  }
  if(target==="drop"){
    scene="drop";
    dropPlayerX=100;dropPlayerY=460;dropVX=0;dropVY=0;dropOnGround=false;
    dropTimer=60;dropFailed=false;dropFailedT=0;
    bgm.volume = 0.9;  // 🔊 드랍 맵에서만 볼륨 업
    playBGM("모여봐요 조방 - drop.mp3");
    return;
  }
  currentMap=target;
  PL.x=spawnX;PL.y=spawnY;PL.vx=0;PL.vy=0;PL.onGround=false;
  scene="game";
  updateMapUI();

  // 맵별 BGM
  if(target==="corridor"){
    playBGM("모여봐요 조방 - 조교.mp3");
  }else if(target==="classroom"){
    playBGM("모여봐요 조방 - 강의실.mp3");
  }else if(target==="library"){
    playBGM("모여봐요 조방 - 도서관.mp3");
  }
}

  if(!map.portals)return false;
  for(const p of map.portals){
    if(p.cond&&!p.cond())continue;
    if(overlap(PL,p)){
      gotoMap(p.target,p.spawnX,p.spawnY);
      return true;
    }
  }
  return false;
}

function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function overlapNPC(npc){return Math.abs((PL.x+PL.w/2)-(npc.x+npc.w/2))<50;}

/* ══════ 인터랙션 ══════ */
function tryInteract(){
  const map=getMap();
  if(map.npcs)for(const n of map.npcs)if(overlapNPC(n)){n.fn();return;}
  if(map.boards)for(const b of map.boards){
    const cx2=PL.x+PL.w/2;
    if(cx2>b.x&&cx2<b.x+b.w){b.fn();return;}
  }
}

/* ══════ 인터랙션 함수 (순서 조건 강화) ══════ */
function openTA(){
  if(!state.intro)openDialog(T.taIntro);
  else openDialog([{speaker:"조사방법론 조교",text:"강의실에서 김병조 교수님을 찾아가 보세요!"}]);
}

function openProf(){
  if(!state.intro){openDialog([{speaker:"김병조 교수님",text:"먼저 복도에서 조사방법론 조교와 이야기하고 오세요."}]);return;}
  if(state.purposive&&libraryBad&&!state.theoretical){openDialog(T.profAngry);return;} // ← !state.saturation → !state.theoretical 로 변경
  if(!state.purposive){openDialog(T.profFirst);return;}
  if(!state.theoretical){openDialog(T.profWaitLib);return;}
  if(!state.saturation){openDialog(T.profSatHint);return;}
  if(!state.submitted){openDialog(T.profFinal);return;}
  openDialog([{speaker:"김병조 교수님",text:"잘 하고 있어요. 어서 논문 작성을 시작합시다!"}]);
}

function openLibrary(){
  if(!state.purposive){openDialog([{speaker:"도서관 근로장학생",text:"먼저 교수님께 목적적 표집을 배우고 오세요."}]);return;}
  if(!state.theoretical)openDialog(T.library);
  else openDialog([{speaker:"도서관 근로장학생",text:"이론이 누구를 요구하는가, 그 질문을 잊지 마세요."}]);
}

function openPhD(){
  if(!state.theoretical){openDialog([{speaker:"박사과정생",text:"너넨 이런거 하지마라..."},
    {speaker:"박사과정생",text:"헉! 죄송해요, 혼잣말이 너무 컸군요. "}
  ]);return;}
  if(!state.saturation)openDialog(T.phdIntro);
  else openDialog([{speaker:"박사과정생",text:"포화는 감이 아니라 기록입니다. 언제나 메모를 남기세요."}]);
}

function openDesk(){
  if(!state.submitted){openDialog([{speaker:"제출 Desk",text:"아직 교수님과 마지막 대화를 끝내지 못했어요."}]);return;}
  if(state.deskDone){openDialog([{speaker:"제출 Desk",text:"이미 제출했어요!"}]);return;}
  openDialog([
    {speaker:"유미",text:"(손을 떨며 제출 버튼을 누른다) ...드디어 끝났다."},
    {speaker:"제출 Desk",text:"연구제안서 제출 완료! 이주민 예술가들의 목소리가 정책의 언어가 될 수 있도록 — 수고했어요."},
    {speaker:"제출 Desk",text:"🎉",
     onEnd:()=>{state.deskDone=true;setQ(5);setTimeout(()=>{scene="ending_screen";},400);}}
  ]);
}

const CHASE_DOOR={x:790,y:GROUND_Y-70,w:30,h:70};

function startChase(){
  bgm.volume = 0.7;  // 🔊 추격전에서만 볼륨 업
  playBGM("모여봐요 조방 - chasing.mp3");
  PROF_CHASE_ACTIVE=true;
  chasePaused=true;
  chaseWarningMsg="🚨 교수님이 실망하셨습니다. 최대한 빨리 도망치세요. 🚨";
  scene="chase";
  chaseTimer=25.0; // 20초
   chaseJustStarted = true; 
  profScale=2.0;   // 처음에 크게
  chasePhase=0;
  PROF.x=-700;PROF.y=GROUND_Y-80;PROF.vx=0;PROF.vy=0;PROF.onGround=false;
  PROF.speed=130;
  PL.x=620;PL.y=GROUND_Y-44;PL.vx=0;PL.vy=0;PL.onGround=false;
}

function updateChase(dt){
  if(chasePaused)return; // 일시정지 시 업데이트 중단

  // 타이머 감소
  chaseTimer-=dt;

  // 교수 크기: 20초에서 0초로 갈수록 2.2 → 0.8
  const ratio=Math.max(0,chaseTimer/25);
  profScale=1+2.5*ratio; // 20초=2.2, 0초=0.8

  // 20초 생존 성공
  if(chaseTimer<=0){
  chaseTimer=0;
  PROF_CHASE_ACTIVE=false;
  addToast("🎉 생존 성공! 도서관으로 돌아갑니다.");
  setTimeout(()=>{
    scene="game";
    currentMap="library";
    PL.x=80;PL.y=GROUND_Y-44;PL.vx=0;PL.vy=0;
    updateMapUI();
     bgm.volume = 0.4;
    playBGM("모여봐요 조방 - 도서관.mp3");
  },1500);
  return;
}

  // 교수 AI
  const dx=PL.x-PROF.x;
  PROF.vx=(dx>0?1:-1)*PROF.speed;
  PROF.vy+=G*dt;
  PROF.x+=PROF.vx*dt;
  PROF.y+=PROF.vy*dt;
  physResolve(PROF,CHASE_PLATFORMS);
  if(PROF.onGround&&PL.y<PROF.y-30)PROF.vy=JUMP*1;

  // 플레이어 이동
  if(K["ArrowLeft"])PL.vx=-SPEED;
  else if(K["ArrowRight"])PL.vx=SPEED;
  else PL.vx=0;
  PL.vy+=G*dt;
  PL.x+=PL.vx*dt;
  PL.y+=PL.vy*dt;
  // 벽
  PL.x=Math.max(0,Math.min(W-PL.w,PL.x));
  physResolve(PL,CHASE_PLATFORMS);

  // 문 접근 → 일시정지 + 안내
  if(overlap(PL,CHASE_DOOR)&&!chasePaused){
    chasePaused=true;
    chaseWarningMsg="수강신청 정정기간이 지나서\n나갈 수 없습니다.\n[Space] 확인";
    return;
  }

  // 교수에게 잡히면
  const profHitbox={x:PROF.x,y:PROF.y,w:PROF.w*profScale,h:PROF.h*profScale};
  if(overlap(PL,profHitbox)){
    scene="reject";
    rejectT=0;
    PROF_CHASE_ACTIVE=false;
  }
}

/* ══════ 드랍 맵 업데이트 ══════ */
function updateDrop(dt){
  if(!dropFailed){
    dropTimer-=dt;
    if(dropTimer<=0){
      dropTimer=0;
      dropFailed=true;
      dropFailedT=0;
      return;
    }
  }else{
    dropFailedT+=dt;
    if(dropFailedT>2.5){
      dropFailed=false;
      dropTimer=30;
      scene="game";
      currentMap="classroom";
      PL.x=80;PL.y=GROUND_Y-44;
      PL.vx=0;PL.vy=0;
      updateMapUI();
    }
    return;
  }

  // 이동
  const ACCEL=250;
const FRICTION=0.96;
if(K["ArrowLeft"])dropVX=Math.max(dropVX-ACCEL*dt,-DROP_SPEED);
else if(K["ArrowRight"])dropVX=Math.min(dropVX+ACCEL*dt,DROP_SPEED);
else dropVX*=FRICTION;

  dropVY+=DROP_G*dt;
  dropPlayerX+=dropVX*dt;
  dropPlayerY+=dropVY*dt;

  // 벽
  dropPlayerX=Math.max(0,Math.min(W-PL.w,dropPlayerX));

  // 플랫폼 충돌
  dropOnGround=false;
  for(const p of DROP_PLATFORMS){
    if(dropPlayerX+PL.w>p.x&&dropPlayerX<p.x+p.w){
      if(dropPlayerY+PL.h>p.y&&dropPlayerY+PL.h<p.y+p.h+20&&dropVY>=0){
        dropPlayerY=p.y-PL.h;
        dropVY=0;
        dropOnGround=true;
      }
    }
  }

  // 바닥 아래로 떨어지면 리셋
  if(dropPlayerY>500){dropPlayerY=455;dropVY=0;}

  // 꼭대기 문 충돌 감지
  const dropDoor={x:90,y:40,w:80,h:50};
  const dropPL={x:dropPlayerX,y:dropPlayerY,w:PL.w,h:PL.h};
  if(overlap(dropPL,dropDoor)){
    scene="charSelect";
    charIdx=0;
  }
}

/* ══════ 물리 헬퍼 ══════ */
function physResolve(obj,platforms){
  obj.onGround=false;
  if(obj.y+obj.h>GROUND_Y+80){obj.y=GROUND_Y+80-obj.h;obj.vy=0;obj.onGround=true;}
  for(const p of platforms){
    if(obj.x+obj.w>p.x&&obj.x<p.x+p.w){
      if(obj.y+obj.h>p.y&&obj.y+obj.h<p.y+p.h+20&&obj.vy>=0){
        obj.y=p.y-obj.h;obj.vy=0;obj.onGround=true;
      }
    }
  }
  if(obj.x<0){obj.x=0;obj.vx=0;}
  if(obj.x+obj.w>W){obj.x=W-obj.w;obj.vx=0;}
}

/* ══════ 메인 게임 업데이트 ══════ */
function updateGame(dt){
  if(dialog.open)return;
  // 이동
  if(K["ArrowLeft"]){PL.vx=-SPEED;PL.dir=-1;}
  else if(K["ArrowRight"]){PL.vx=SPEED;PL.dir=1;}
  else PL.vx=0;
  PL.vy+=G*dt;
  PL.x+=PL.vx*dt;
  PL.y+=PL.vy*dt;
  PL.x=Math.max(0,Math.min(W-PL.w,PL.x));
  const map=getMap();
  const allPlats=[{x:0,y:GROUND_Y,w:W,h:80,color:map.floor.color},...(map.platforms||[])];
  physResolve(PL,allPlats);
  // 애니
  if(PL.vx!==0&&PL.onGround){PL.frameT+=dt;if(PL.frameT>0.12){PL.frameT=0;PL.frame=(PL.frame+1)%4;}}
  else PL.frame=0;
}

/* ══════ wrapTxt ══════ */
function wrapTxt(t,maxW){
  const words=t.split("");let line="",lines=[];
  cx.font="14px 'Malgun Gothic',sans-serif";
  for(const ch of words){
    const test=line+ch;
    if(cx.measureText(test).width>maxW){lines.push(line);line=ch;}
    else line=test;
  }
  if(line)lines.push(line);
  return lines;
}

  let cx2=d.x;
  chars.forEach((ch,i)=>{
    cx.save();
    cx.translate(cx2,d.y+wobbles[i%wobbles.length]);
    cx.globalAlpha=alphas[i%alphas.length];
    cx.fillStyle="#ddd8c4";
    cx.fillText(ch,0,0);
    cx.restore();
    cx2+=8;
  });
  cx.restore();
}
  cx.restore();cx.textAlign="left";
}

/* ══════ 그리기: 포탈 ══════ */
function drawPortals(map){
  if(!map.portals)return;
  const t=Date.now()/1000;
  for(const p of map.portals){
    const canUse=(!p.cond||p.cond());
    cx.save();
    if(!canUse){cx.globalAlpha=0.35;}
    const grd=cx.createRadialGradient(p.x+p.w/2,p.y+p.h/2,2,p.x+p.w/2,p.y+p.h/2,p.w);
    // 드랍 포탈은 붉은색
    const hue=p.isDrop?0:(canUse?270:200);
    grd.addColorStop(0,`hsla(${hue},80%,70%,.9)`);
    grd.addColorStop(1,`hsla(${hue},80%,30%,.2)`);
    cx.fillStyle=grd;cx.fillRect(p.x,p.y,p.w,p.h);
    cx.strokeStyle=`hsla(${hue},90%,70%,${.6+.4*Math.sin(t*3)})`;
    cx.lineWidth=2+Math.sin(t*3);cx.strokeRect(p.x,p.y,p.w,p.h);
    cx.fillStyle="#fff";cx.font="bold 11px sans-serif";cx.textAlign="center";
    cx.fillText(p.label,p.x+p.w/2,p.y-6);
    if(canUse){
      cx.fillStyle=p.isDrop?"#fca5a5":"rgba(253,230,138,.9)";cx.font="10px sans-serif";
      cx.fillText("[↑] 진입",p.x+p.w/2,p.y+p.h+14);
    }else{
      cx.fillStyle="#94a3b8";cx.font="10px sans-serif";cx.fillText("잠김",p.x+p.w/2,p.y+p.h+14);
    }
    cx.restore();cx.textAlign="left";
  }
}

//강아지 그리기
function drawDog(x,y,charIdx){
  const bodyColor=charIdx===0?"#f0ece8":charIdx===1?"#c8945a":"#7a4e2a";
  const earColor=charIdx===0?"#e0d8d0":charIdx===1?"#a87040":"#5a3418";
  const noseColor="#2d1a0e";

  cx.save();
  cx.translate(x,y);

  // 꼬리
  cx.fillStyle=bodyColor;
  cx.beginPath();cx.ellipse(18,2,5,3,Math.PI/4,0,Math.PI*2);cx.fill();

  // 몸통
  cx.fillStyle=bodyColor;
  cx.beginPath();cx.ellipse(3,4,14,10,0,0,Math.PI*2);cx.fill();

  // 다리 4개
  cx.fillStyle=bodyColor;
  cx.fillRect(-10,10,5,8);
  cx.fillRect(-3,10,5,8);
  cx.fillRect(4,10,5,8);
  cx.fillRect(11,10,5,8);

  // 머리 (몸통보다 먼저 그려서 귀가 머리 뒤로)
  // 귀 (머리 위 양쪽, 얼굴 안 가림)
  cx.fillStyle=earColor;
  cx.beginPath();cx.ellipse(-18,0,4,7,Math.PI*0.1,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.ellipse(-6,-7,4,7,Math.PI*0.1,0,Math.PI*2);cx.fill();

  // 머리 (귀 위에 덮어서 얼굴 가림 방지)
  cx.fillStyle=bodyColor;
  cx.beginPath();cx.arc(-12,0,9,0,Math.PI*2);cx.fill();

  // 눈 두 개 다 보이게
  cx.fillStyle="#2d1a0e";
  cx.beginPath();cx.arc(-16,0,1.8,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(-9,0,1.8,0,Math.PI*2);cx.fill();
  // 눈 하이라이트
  cx.fillStyle="white";
  cx.beginPath();cx.arc(-15.3,-0.5,0.7,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(-8.3,-0.5,0.7,0,Math.PI*2);cx.fill();

  // 코
  cx.fillStyle=noseColor;
  cx.beginPath();cx.ellipse(-12,3,2.5,2,0,0,Math.PI*2);cx.fill();

  // 입
  cx.strokeStyle=noseColor;cx.lineWidth=1;
  cx.beginPath();cx.moveTo(-12,5);cx.lineTo(-14,7);cx.stroke();
  cx.beginPath();cx.moveTo(-12,5);cx.lineTo(-10,7);cx.stroke();

  cx.restore();
}

}

/* ══════ onSpace / onUp 최종 (기존 선언 덮어쓰기) ══════ */
// NOTE: 위에서 이미 선언된 onSpace/onUp은 JS 호이스팅 없이
// 마지막 선언이 이벤트 핸들러에서 호출되므로, keydown 핸들러의
// onSpace/onUp 참조가 최신 함수를 가리키도록 window에 등록합니다.
window._onSpace=function(){
  if(scene==="ending_screen"){resetGame();return;}
  if(scene==="title"){scene="charSelect";playBGM("모여봐요 조방 - 캐릭터 선택.mp3");return;}
  if(scene==="charSelect"){selectedChar=CHARS[charIdx];scene="game";initGame();return;}
  if(scene==="reject"){resetGame();return;}
  if(scene==="drop"){return;}
  if(scene==="chase"){
  if(chaseJustStarted){
    // 대사에서 쓰던 Space 입력은 무시하고,
    // 추격 시작 후 새로 누른 Space부터 안내창을 닫게 함
    chaseJustStarted = false;
    return;
  }
  if(chasePaused){
    chasePaused=false;
    return;
  }
  return;
}

  if(scene==="game"||scene==="ending_dlg"){
    if(dialog.open){
      if(dialog.choices)pickChoice(dialog.choices[choiceIdx].fn);
      else dlgNext();
    }else{
      tryInteract();
    }
  }
};
window._onUp=function(){
  if(scene==="charSelect"){charIdx=(charIdx+1)%CHARS.length;return;}
  if(scene==="game"){
    if(!dialog.open&&tryPortal())return;
    if(PL.onGround){PL.vy=JUMP;}
  }
  if(scene==="chase"){
    if(!chasePaused&&PROF_CHASE_ACTIVE&&PL.onGround)PL.vy=JUMP;
  }
  if(scene==="drop"){
    if(dropOnGround)dropVY=DROP_JUMP;
  }
  if(dialog.open&&dialog.choices)
    choiceIdx=Math.max(0,choiceIdx-1);
};

/* ══════ 입력 핸들러 재등록 (최신 함수 참조) ══════ */
window.removeEventListener("keydown",window._keydownHandler);
window._keydownHandler=function(e){
  K[e.key]=true;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
  if(e.key===" "&&!spaceConsumed){spaceConsumed=true;window._onSpace();}
  if(e.key==="ArrowUp"&&!upConsumed){upConsumed=true;window._onUp();}
  if(e.key==="ArrowDown"&&dialog.open&&dialog.choices)
    choiceIdx=Math.min(dialog.choices.length-1,choiceIdx+1);
};
window.addEventListener("keydown",window._keydownHandler);


/* ══════ 메인 루프 ══════ */
let lastTime=0;
function loop(ts){
pendingBGM = "모여봐요 조방 - 캐릭터 선택.mp3";
  requestAnimationFrame(loop);
  const dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;
  titleT+=dt;
  cx.clearRect(0,0,W,H);

  if(scene==="title"){
    drawTitle(dt);
  }else if(scene==="charSelect"){
    drawCharSelect();
  }else if(scene==="game"){
    updateGame(dt);
    drawGameScene(dt);
  }else if(scene==="chase"){
    updateChase(dt);
    drawChaseScene();
  }else if(scene==="drop"){
    updateDrop(dt);
    drawDropScene();
  }else if(scene==="reject"){
    drawReject(dt);
  }else if(scene==="ending_dlg"){
    // 대화 끝나면 onEnd에서 scene="ending_screen" 설정됨
    drawGameScene(dt);
  }else if(scene==="ending_screen"){
    drawEndingScreen();
  }
}

/* ══════ 초기화 ══════ */
updateQUI();
requestAnimationFrame(loop);
</script>
